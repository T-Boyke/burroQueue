name: "Bug Report"
description: "Report an unexpected error or defect in burroQueue."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide detailed steps to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: "burroQueue Version"
      description: "Which version of burroQueue are you running? (e.g., 1.0.0 or commit hash)"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "Windows Build"
      description: "Which Windows 11 build is installed?"
      placeholder: "Windows 11 Pro 24H2 (Build 26100)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "Description"
      description: "Describe what went wrong."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to trigger the bug."
      value: |
        1. Start burroQueue.
        2. Paste or drop link: '...'
        3. Observe: '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should have happened instead?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / Diagnostics"
      description: "Paste relevant log messages, stack traces, or console outputs."
      render: shell
