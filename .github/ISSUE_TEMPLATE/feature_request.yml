name: "Feature Request"
description: "Propose a new feature, improvement, or architectural enhancement for burroQueue."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Use Case"
      description: "What office or audio workflow challenge does this address?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the desired capability and its technical behavior."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative approaches or workarounds evaluated?"
  - type: checkboxes
    id: guidelines
    attributes:
      label: "Architecture Compliance"
      options:
        - label: "Domain logic must remain pure (zero external NuGet packages, zero UI or network dependencies)."
          required: true
        - label: "Standby memory footprint must remain under 30 MB RAM (no WebView2 or Electron wrappers)."
          required: true
