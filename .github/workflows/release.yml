name: burroQueue Release & Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-package:
    name: Build Self-Contained Win11 Exe & Inno Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Architecture & 1CPF Verification
        shell: pwsh
        run: ./scripts/verify-architecture.ps1

      - name: Run Unit & Integration Tests
        run: dotnet test burroQueue.sln --configuration Release

      - name: Publish Self-Contained Single-File Executable
        run: >
          dotnet publish src/burroQueue.Presentation/burroQueue.Presentation.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          --output ./publish/burroQueue-win-x64

      - name: Ensure Assets in Publish Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish/burroQueue-win-x64/Assets | Out-Null
          Copy-Item assets/app.ico, assets/logo.png -Destination ./publish/burroQueue-win-x64/Assets/ -Force
          Copy-Item LICENSE, README.md -Destination ./publish/burroQueue-win-x64/ -Force

      - name: Build Inno Setup Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/installer/burroQueue.iss

      - name: Package Portable ZIP (Standalone Exe)
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/burroQueue-win-x64/* -DestinationPath ./publish-installer/burroQueue-portable-win-x64.zip -Force

      - name: Upload Build Artifacts (Installer & Portable)
        uses: actions/upload-artifact@v4
        with:
          name: burroQueue-windows-binaries
          path: ./publish-installer/*

      - name: Create GitHub Release with Installer & Exe Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./publish-installer/burroQueue-Setup-x64.exe
            ./publish-installer/burroQueue-portable-win-x64.zip
          generate_release_notes: true
