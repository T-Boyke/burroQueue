name: burroQueue Release, Code Signing & Installer

on:
  workflow_run:
    workflows: ["burroQueue CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      override_version:
        description: 'Optional SemVer override (e.g. 2.2.0). Leave empty for automatic SemVer increment.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: burroQueue-release-main
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-sign-and-package:
    name: Auto-Version, Build .NET 11 Win11 Exe, Inno Setup Installer & GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: windows-latest
    outputs:
      next_tag: ${{ steps.calc-version.outputs.next_tag }}
      next_version: ${{ steps.calc-version.outputs.next_version }}
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && (vars.SIGNPATH_ORGANIZATION_ID != '' || secrets.SIGNPATH_ORGANIZATION_ID != '') }}
      SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'burroqueue' }}
      SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      SIGNPATH_EXE_CONFIG: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG_SLUG || '' }}
      SIGNPATH_INSTALLER_CONFIG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG || '' }}

    steps:
      - name: Checkout Repository (Full History & Tags)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Calculate Next Auto-Incrementing Version
        id: calc-version
        shell: pwsh
        run: |
          git fetch --tags --force
          ./scripts/generate-release-notes.ps1 `
            -OutputPath "./publish-installer/RELEASE_NOTES.md" `
            -OverrideVersion "${{ github.event.inputs.override_version }}"

      - name: Setup Node.js 24 for UnoCSS 66.12.0 Build
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/burroQueue.WebDrop/package-lock.json'

      - name: Compile UnoCSS 66.12.0 WebDrop Stylesheet
        working-directory: src/burroQueue.WebDrop
        run: |
          npm ci
          npm run build:css

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Run Architecture & 1CPF Verification
        shell: pwsh
        run: ./scripts/verify-architecture.ps1

      - name: Publish Self-Contained Single-File Executable (.NET 11 win-x64)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.calc-version.outputs.next_version }}
        run: |
          dotnet publish src/burroQueue.Presentation/burroQueue.Presentation.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$env:RELEASE_VERSION `
            -p:FileVersion="$env:RELEASE_VERSION.0" `
            -p:InformationalVersion="$env:RELEASE_VERSION" `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            --output ./publish/burroQueue-win-x64
          New-Item -ItemType Directory -Force -Path ./publish/burroQueue-win-x64/Assets | Out-Null
          Copy-Item ./assets/app.ico, ./assets/logo.png -Destination ./publish/burroQueue-win-x64/Assets/ -Force
          Copy-Item ./LICENSE, ./README.md -Destination ./publish/burroQueue-win-x64/ -Force
          New-Item -ItemType Directory -Force -Path ./publish-installer | Out-Null

      - name: Upload Unsigned Application Binary for SignPath Attestation
        id: upload-unsigned-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-burroQueue-exe
          path: ./publish/burroQueue-win-x64/burroQueue.exe

      - name: Sign Application Binary (burroQueue.exe) via SignPath.io
        if: env.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_EXE_CONFIG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './publish/burroQueue-win-x64'

      - name: Verify Authenticode Signature on burroQueue.exe
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "./publish/burroQueue-win-x64/burroQueue.exe"
          Write-Host "burroQueue.exe Authenticode Status: $($sig.Status) | Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature verification failed for burroQueue.exe: $($sig.StatusMessage)"
          }

      - name: Skip SignPath Code Signing When Secrets Are Not Configured
        if: env.SIGNPATH_ENABLED != 'true'
        shell: pwsh
        run: |
          Write-Host "[INFO] SIGNPATH_API_TOKEN ist noch nicht hinterlegt. Code-Signing wird uebersprungen und das Release direkt gebaut."

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.calc-version.outputs.next_version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION" "scripts/installer/burroQueue.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload Unsigned Inno Setup Installer for SignPath Attestation
        id: upload-unsigned-installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-burroQueue-installer
          path: ./publish-installer/burroQueue-Setup-x64.exe

      - name: Sign Inno Setup Installer (burroQueue-Setup-x64.exe) via SignPath.io
        if: env.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_CONFIG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './publish-installer'

      - name: Verify Authenticode Signature on burroQueue-Setup-x64.exe
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "./publish-installer/burroQueue-Setup-x64.exe"
          Write-Host "burroQueue-Setup-x64.exe Authenticode Status: $($sig.Status) | Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature verification failed for burroQueue-Setup-x64.exe: $($sig.StatusMessage)"
          }

      - name: Package Portable ZIP, Generate SHA-256 Checksums & Detailed Release Notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.calc-version.outputs.next_version }}
        run: |
          Compress-Archive -Path ./publish/burroQueue-win-x64/* -DestinationPath ./publish-installer/burroQueue-portable-win-x64.zip -Force
          $filesToHash = @(
            "./publish-installer/burroQueue-Setup-x64.exe",
            "./publish-installer/burroQueue-portable-win-x64.zip"
          )
          $hashLines = foreach ($file in $filesToHash) {
            $item = Get-Item $file -ErrorAction Stop
            $h = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($item.Name)"
          }
          $sumsPath = Join-Path $PWD "publish-installer/SHA256SUMS.txt"
          [System.IO.File]::WriteAllLines($sumsPath, [string[]]$hashLines, [System.Text.UTF8Encoding]::new($false))
          Get-Content $sumsPath

          ./scripts/generate-release-notes.ps1 `
            -OutputPath "./publish-installer/RELEASE_NOTES.md" `
            -ChecksumsPath "./publish-installer/SHA256SUMS.txt" `
            -OverrideVersion "$env:RELEASE_VERSION"

      - name: Upload Build Artifacts (Installer, Portable ZIP, Checksums & Changelog)
        uses: actions/upload-artifact@v7
        with:
          name: burroQueue-windows-binaries
          path: ./publish-installer/*

      - name: Commit Bumped Version Files Back to Main
        shell: pwsh
        env:
          NEXT_VERSION: ${{ steps.calc-version.outputs.next_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $changed = git status --porcelain Directory.Build.props scripts/installer/burroQueue.iss
          if (-not [string]::IsNullOrWhiteSpace($changed)) {
            git add Directory.Build.props scripts/installer/burroQueue.iss
            git commit -m "chore(release): bump version to $env:NEXT_VERSION [skip ci]"
            git push origin HEAD:main
          }

      - name: Create Auto-Incrementing Git Tag & Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.calc-version.outputs.next_tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$env:NEXT_TAG" "$env:TARGET_SHA" -m "Release $env:NEXT_TAG" -f
          git push origin "$env:NEXT_TAG" --force

          gh release create "$env:NEXT_TAG" `
            ./publish-installer/burroQueue-Setup-x64.exe `
            ./publish-installer/burroQueue-portable-win-x64.zip `
            ./publish-installer/SHA256SUMS.txt `
            --title "burroQueue $env:NEXT_TAG" `
            --notes-file ./publish-installer/RELEASE_NOTES.md `
            --target "$env:TARGET_SHA" `
            --latest

  publish-winget:
    name: Publish T-Boyke.burroQueue to winget-pkgs
    needs: build-sign-and-package
    if: needs.build-sign-and-package.result == 'success'
    runs-on: windows-latest
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate WinGet Manifests
        shell: pwsh
        run: |
          ./scripts/winget/generate-winget-manifests.ps1 -Version "${{ needs.build-sign-and-package.outputs.next_version }}"

      - name: Upload WinGet Manifests Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: scripts/winget/manifests/

      - name: Submit Package to microsoft/winget-pkgs via Komac
        id: winget-releaser
        if: env.HAS_WINGET_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: T-Boyke.burroQueue
          version: ${{ needs.build-sign-and-package.outputs.next_version }}
          installers-regex: 'burroQueue-Setup-x64\.exe$'
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}

      - name: Handle WinGet Submission Status
        if: env.HAS_WINGET_TOKEN == 'true'
        shell: pwsh
        run: |
          if ('${{ steps.winget-releaser.outcome }}' == 'failure') {
            Write-Host "::warning title=Initial WinGet Submission Required::Package 'T-Boyke.burroQueue' does not exist yet in microsoft/winget-pkgs. For brand-new packages, an initial onboarding PR must be submitted to microsoft/winget-pkgs."
            "### WinGet: Erstveröffentlichung erforderlich" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Das Paket `T-Boyke.burroQueue` existiert noch nicht im offiziellen [microsoft/winget-pkgs](https://github.com/microsoft/winget-pkgs) Repository." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- Die fertigen, validierten Manifest-Dateien wurden automatisch generiert und liegen im Workflow-Artefakt `winget-manifests` bereit." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- Für die Erstaufnahme kann der PR per `wingetcreate submit` oder manuell eingereicht werden." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- Sobald die Erstaufnahme gemergt wurde, erfolgen alle Folge-Updates vollautomatisch über diese GitHub Action." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "### WinGet Deployment erfolgreich" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Pull Request für `T-Boyke.burroQueue` v${{ needs.build-sign-and-package.outputs.next_version }} wurde erfolgreich an microsoft/winget-pkgs übermittelt!" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Inform Missing WinGet Token
        if: env.HAS_WINGET_TOKEN != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning title=WinGet Token Missing::WINGET_GITHUB_TOKEN secret is not configured in repository. To enable automatic winget submission, configure a GitHub PAT with repo scope as WINGET_GITHUB_TOKEN."
          "### WinGet Deployment übersprungen" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Das Secret `WINGET_GITHUB_TOKEN` ist im Repository nicht konfiguriert. Bitte erstelle ein GitHub Personal Access Token mit dem Scope `public_repo` und hinterlege es als Repository-Secret `WINGET_GITHUB_TOKEN`." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
