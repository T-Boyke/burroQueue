<!DOCTYPE html>
<html lang="de" data-style-engine="unocss-66.12.0">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>burroQueue – Web Drop</title>
    <link rel="stylesheet" href="/assets/webdrop.css">
</head>
<body class="bq-page">
    <main class="bq-shell">
        <header class="flex items-center justify-between mb-5">
            <div class="text-xl font-bold tracking-tight text-fluent-text flex items-center gap-1">
                <span><span class="text-fluent-accent">burro</span>Queue</span>
            </div>
            <div class="bq-badge">Office Jukebox</div>
        </header>

        <div class="bq-toast">Status Toast</div>

        <section class="bq-section">
            <div class="bq-section-label">Aktuell läuft</div>
            <div class="text-[15px] font-semibold text-fluent-text truncate" id="now-playing-title">Song</div>
            <div class="text-[15px] font-semibold text-fluent-muted truncate">Kein Song aktiv</div>
            <div class="text-xs text-fluent-muted mt-1" id="now-playing-submitter">Eingeworfen von: Alex</div>
            <form method="POST" action="/vote-skip" class="mt-2.5" id="skip-form">
                <button type="submit" class="bq-btn-skip" id="skip-btn">Für Skip stimmen</button>
            </form>
        </section>

        <section class="bq-section">
            <div class="bq-section-label">Warteschlange</div>
            <div class="max-h-[140px] overflow-y-auto mt-2">
                <ol class="m-0 pl-5 text-[13px] text-fluent-text space-y-1" id="queue-list">
                    <li class="mb-1">Track (User)</li>
                </ol>
                <div class="text-[13px] text-fluent-muted italic" id="queue-empty">Warteschlange ist leer</div>
            </div>
        </section>

        <div class="flex items-center gap-3 bg-fluent-subtle border border-solid border-fluent-border rounded-lg px-3 py-2 mb-3.5">
            <img src="/qr.svg" width="48" height="48" class="rounded bg-white p-0.5 shrink-0" alt="QR-Code" />
            <div>
                <div class="text-xs font-semibold text-fluent-text">Smartphone Direkt-Drop</div>
                <div class="text-[11px] text-fluent-muted">QR-Code mit dem Handy scannen, um Songs mobil einzuwerfen.</div>
            </div>
        </div>

        <form method="POST" action="/drop">
            <div class="mb-3 text-left">
                <label for="submitter" class="block text-xs font-semibold text-fluent-muted mb-1.5">Dein Name (optional)</label>
                <input type="text" id="submitter" name="submitter" class="bq-input" maxlength="40" />
            </div>
            <div class="mb-3 text-left">
                <label for="url" class="block text-xs font-semibold text-fluent-muted mb-1.5">YouTube-Link</label>
                <input type="url" id="url" name="url" required autofocus class="bq-input" />
            </div>
            <button type="submit" class="bq-btn-primary">In Warteschlange werfen</button>
        </form>

        <footer class="mt-6 text-[11px] text-fluent-muted text-center">
            burroQueue &bull; Lizenziert unter GNU AGPL-3.0 &bull; <a href="https://github.com/T-Boyke/burroQueue" target="_blank" rel="noopener" class="text-fluent-muted underline hover:text-fluent-text">GitHub</a>
        </footer>
    </main>
</body>
</html>
